name = "formal_conjectures"
keywords = ["math"]
defaultTargets = ["FormalConjectures"]
testDriver = "FormalConjecturesTest"

[leanOptions]
# Pretty-prints `fun a ↦ b`
pp.unicode.fun = true
# Don't assume a typo is a new variable
autoImplicit = false
relaxedAutoImplicit = false
# our own linters which we don't want to force upon downstream packages
weak.linter.style.copyright.formalConjectures = true
weak.linter.style.namespace = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.27.0"

# We make this a separate library so that we can apply different lean options.
[[lean_lib]]
name = "FormalConjecturesForMathlib"

[[lean_lib]]
name = "FormalConjecturesUtil"

[[lean_lib]]
name = "FormalConjecturesTest"
[lean_lib.leanOptions]
# Switch off warnings generated by `sorry`
warn.sorry = false

[[lean_lib]]
name = "FormalConjectures"
globs = [
  "FormalConjectures.+",
  "WOWII217Closure",
  "WOWII217FiniteBase",
  "WOWII217Finite8Cubic",
  "WOWII217Degree8",
  "WOWII217Cubic8",
  "WOWII217Connected8",
  "WOWII217Finite8Semantics",
  "WOWII217Encoding10",
  "WOWII217Encoding8",
  "WOWII217Connected10",
  "WOWII217SmallNExceptions",
  "WOWII217Regular10",
  "WOWII217Finite10Regular",
  "WOWII217Finite10Semantics",
  "WOWII217Closure13Fast",
  "WOWII217DegreePairBridge",
  "WOWII217Finite13",
  "WOWII217Finite13ClosureRel",
  "WOWII217Finite13ConnHighLow",
  "WOWII217Finite13ClosureRelSym",
  "WOWII217Finite13ClosureRelSymHighLow",
  "WOWII217Finite13ClosureRelSymHighLowSharedDeg",
  "WOWII217SpanningTree",
  "WOWII217Hamiltonian",
  "WOWII217Encoding12",
  "WOWII217Encoding13",
  "WOWII217Connected12",
  "WOWII217Degree12",
  "WOWII217Finite12Regular",
  "WOWII217Finite12Semantics",
  "WOWII217Relabel12Core",
  "WOWII217Relabel12ZeroCertificate",
  "WOWII217Relabel12SortedCertificate",
  "WOWII217Relabel12",
  "WOWII217Relabel13",
  "WOWII217ClosureSemantics",
  "WOWII217ClosureSemanticsSmall",
  "WOWII217ClosureCertificateSemantics",
  "WOWII217BondyChvatal",
  "WOWII217Ore",
  "WOWII217Chvatal",
  "WOWII217Mid13",
  "WOWII217SmallN",
  "WOWII217FiniteSmallExceptions",
  "WOWII217ResidueBound",
  "WOWII217Connected14",
  "WOWII217Degree14",
  "WOWII217Relabel14Core",
  "WOWII217Relabel14ZeroCertificate",
  "WOWII217Relabel14SortedCertificate",
  "WOWII217Relabel",
  "WOWII217Classification",
  "WOWII217Semantics",
  "WOWII217Encoding",
  "WOWII217Finite13ClosureSharedDeg",
  "WOWII217Finite13ClosureSharedDegCert",
]
[lean_lib.leanOptions]
# Switch off warnings generated by `sorry`
warn.sorry = false
# our own linters which only make sense for the problems themselves
weak.linter.style.ams_attribute = true
weak.linter.style.category_attribute = true
weak.linter.style.moduleDocstring = true

[[lean_lib]]
name = "FormalConjecturesAnswerPostpone"
globs = ["FormalConjectures.+"]
[lean_lib.leanOptions]
# Switch off warnings generated by `sorry`
warn.sorry = false
# our own linters which only make sense for the problems themselves
weak.linter.style.ams_attribute = true
weak.linter.style.category_attribute = true
weak.linter.style.moduleDocstring = true
weak.google.answer = "postpone"

[[lean_exe]]
name = "extract_names"
srcDir = "scripts"
root = "extract_names"
exeName = "extract_names"
supportInterpreter = true
